<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join YungMora</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header><!-- Same navbar as index --></header>

  <section class="form-container">
    <h1>Fill This Form Correctly</h1>
    <p>Your honesty helps me serve you better.</p>

    <form id="artist-form">
      <input type="text" placeholder="First Name" required>
      <input type="text" placeholder="Last Name" required>
      <input type="email" placeholder="Email Address" required>

      <h2>Gender</h2>
      <label><input type="radio" name="gender"> Male</label>
      <label><input type="radio" name="gender"> Female</label>

      <h2>Do You?</h2>
      <label><input type="checkbox"> Make Music</label>
      <label><input type="checkbox"> Play an Instrument</label>
      <label><input type="checkbox"> Have Music Production Knowledge</label>
      <label><input type="checkbox"> Know Mixing & Mastering</label>

      <h3>How long have you been into music production?</h3>
      <input type="number" placeholder="Years" min="0">

      <h3>What do you want to improve in your music journey?</h3>
      <textarea rows="6" placeholder="Be honest..."></textarea>

      <button type="submit" class="btn primary">Submit</button>
      <div>
         <a href ="index.html" >Back to Home</a>
      </div>
    </form>
  </section>

  <script src="js/script.js"></script>
</body>
</html>
